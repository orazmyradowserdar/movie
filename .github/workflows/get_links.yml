name: Rutube Link Scraper

on:
  workflow_dispatch: # Actions sahypasyndan gol bilen işledmek üçin

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script to fetch links
        run: |
          python -c "
          import requests, urllib.parse
          query = 'фильм на русском'
          url = f'https://rutube.ru/api/search/video/?query={urllib.parse.quote(query)}&page=1'
          headers = {'User-Agent': 'Mozilla/5.0'}
          res = requests.get(url, headers=headers).json()
          
          with open('rutube_links.txt', 'w', encoding='utf-8') as f:
              for item in res.get('results', []):
                  video_id = item.get('id')
                  title = item.get('title')
                  f.write(f'{title} -> https://rutube.ru/video/{video_id}/\n')
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rutube-links-file
          path: rutube_links.txt
