name: Rutube Link Scraper

on:
  workflow_dispatch: # Actions sahypasyndan gol bilen işledmek üçin

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script to fetch links
        run: |
          python -c "
          import requests, urllib.parse
          query = 'фильм на русском'
          url = f'https://rutube.ru/api/search/video/?query={urllib.parse.quote(query)}&page=1'
          res = requests.get(url, headers={'User-Agent': 'Mozilla/5.0'}).json()
          with open('rutube_links.txt', 'w', encoding='utf-8') as f:
              for item in res.get('results', []):
                  f.write(f'https://rutube.ru/video/{item.get(\"id\")}/\n')
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: rutube-links-file
          path: rutube_links.txt
